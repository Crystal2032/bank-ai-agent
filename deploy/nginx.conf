limit_req_zone $binary_remote_addr zone=bank_api:10m rate=10r/s;

server {
    listen 80;
    server_name aibank.yfyckbkb.com 38.55.104.33;
    server_tokens off;
    location / { return 308 https://aibank.yfyckbkb.com$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name aibank.yfyckbkb.com;
    server_tokens off;
    ssl_certificate /etc/bank-ai/tls/domain/fullchain.pem;
    ssl_certificate_key /etc/bank-ai/tls/domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BankTLS:5m;
    ssl_session_timeout 1h;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        limit_req zone=bank_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering off;
        proxy_hide_header X-Powered-By;
    }
    location = /health {
        proxy_pass http://backend:3001/health;
    }
    location = /.well-known/assetlinks.json {
        root /usr/share/nginx/html;
        default_type application/json;
        try_files $uri =404;
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
